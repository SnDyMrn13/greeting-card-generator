<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Make a Silly Card</title>
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.min.css">
	
</head>

<body>
	<header>
		<nav>
		</nav>
	</header>
	<main>
		<section id="order-section">
			<h2>Order a card</h2>
				<label>A name
					<input id="name-input" name="name-input" type="text"/>
				</label>
				
				<label>An adjective
					<input id="adjective-input" name="adjective-input" type="text"/>
				</label>
				
				<label>A noun
					<input id="noun-input" name="noun-input" type="text"/>
				</label>
				
				<label>A food
					<input id="food-input" name="food-input" type="text"/>
				</label>
				
				<label>A game
					<input id="game-input" name="game-input" type="text"/>
				</label>
				
				
				<button type="button" id="make-button">Make my card</button>
				
		</section>
		
		<section id="card-section">

			<article>
				<p id="card-text">Your card will appear here.</p>
			</article>
			
		</section>
	</main>
	
		
	<footer>
	</footer>
	
	<script src="card.js"></script>
	
</body>
</html>
